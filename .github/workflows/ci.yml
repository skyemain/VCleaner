name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build, test (including Windows-only tests) and publish the single-file exe
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        run: ./build/publish.ps1

      - name: Build a release version from a tag
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        run: |
          $tagVersion = '${{ github.ref_name }}'.TrimStart('v')
          $fileVersion = (Get-Content VERSION -Raw).Trim()
          if ($tagVersion -ne $fileVersion) { throw "Tag $tagVersion does not match VERSION $fileVersion" }
          ./build/publish.ps1 -Release

      - uses: actions/upload-artifact@v4
        with:
          name: CleanSlate-win-x64
          path: |
            artifacts/release/*.exe
            artifacts/release/SHA256SUMS.txt

  linux-portable-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet test CleanSlate.sln -c Release --filter "FullyQualifiedName!~WindowsTests"

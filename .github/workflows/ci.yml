name: Windows candidate
on:
  push:
    branches: [windows]
    paths-ignore: ['release/**']
  pull_request:
    branches: [windows]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build, test and package
        shell: pwsh
        run: ./build/publish.ps1 -Release -ToRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Clenzy-windows-candidate
          path: artifacts/release/*
          if-no-files-found: error
      - name: Publish candidate to Windows branch
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          git fetch origin windows
          if ((git rev-parse origin/windows) -ne '${{ github.sha }}') { exit 0 }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A release
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m 'Publish Windows candidate [skip ci]'
          git push origin HEAD:windows

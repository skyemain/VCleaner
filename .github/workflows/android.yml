name: Android candidate
on:
  push:
    branches: [android]
    paths-ignore: ['release/**']
  pull_request:
    branches: [android]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build and test
        run: gradle testDebugUnitTest lintDebug assembleDebug assembleRelease assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: |
            gradle connectedDebugAndroidTest || { find app/build/outputs/androidTest-results -name '*.xml' -exec cat {} +; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: Clenzy-Android-candidate
          path: app/build/outputs/apk/
      - name: Publish installable debug candidate
        if: github.event_name != 'pull_request'
        run: |
          git fetch origin android
          if [ "$(git rev-parse origin/android)" != "${{ github.sha }}" ]; then exit 0; fi
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/Clenzy-1.0-android-candidate.apk
          (cd release && sha256sum *.apk > SHA256SUMS.txt)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release
          git diff --cached --quiet && exit 0
          git commit -m 'Publish Android debug candidate [skip ci]'
          git push origin HEAD:android

name: Android candidate
on:
  push:
    branches: [android]
    paths-ignore: ['release/**']
  pull_request:
    branches: [android]
  workflow_dispatch:
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: false
      - name: Restore release signing identity
        env:
          KEYSTORE: ${{ secrets.CLENZY_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.CLENZY_STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ] && [ -n "$STORE_PASSWORD" ]; then
            umask 077
            printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/clenzy-release.p12"
            echo "CLENZY_KEYSTORE=$RUNNER_TEMP/clenzy-release.p12" >> "$GITHUB_ENV"
          else
            echo 'Release signing secrets not configured; unsigned release retained for local signing.'
          fi
      - name: Build and test
        env:
          CLENZY_STORE_PASSWORD: ${{ secrets.CLENZY_STORE_PASSWORD }}
        run: gradle testDebugUnitTest lintDebug assembleDebug assembleRelease bundleRelease assembleDebugAndroidTest
      - name: Verify release signature
        if: env.CLENZY_KEYSTORE != ''
        run: '"$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          profile: pixel_5
          arch: x86_64
          cores: 2
          ram-size: 2048M
          disable-animations: true
          script: |
            gradle connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true || { find app/build/outputs/androidTest-results -name '*.xml' -exec cat {} +; adb logcat -d -s AndroidRuntime System.err; exit 1; }
            adb shell am force-stop com.skyemain.clenzy
            adb shell am start -n com.skyemain.clenzy/.HomeActivity
            sleep 3
            mkdir -p screenshots
            adb exec-out screencap -p > screenshots/Clenzy-Android-home.png
            adb pull /sdcard/Android/data/com.skyemain.clenzy/files/Clenzy-Android-review.png screenshots/Clenzy-Android-review.png
      - uses: actions/upload-artifact@v4
        with:
          name: Clenzy-Android-screenshots
          path: screenshots/
      - uses: actions/upload-artifact@v4
        with:
          name: Clenzy-Android-candidate
          path: |
            app/build/outputs/apk/
            app/build/outputs/bundle/
      - name: Publish signed release candidate
        if: github.event_name != 'pull_request' && env.CLENZY_KEYSTORE != ''
        run: |
          git fetch origin android
          if [ "$(git rev-parse origin/android)" != "${{ github.sha }}" ]; then exit 0; fi
          mkdir -p release
          rm -f release/Clenzy-*-android-candidate.apk
          cp app/build/outputs/apk/release/app-release.apk release/Clenzy-1.2.0-android-candidate.apk
          (cd release && sha256sum *.apk > SHA256SUMS.txt)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release
          git diff --cached --quiet && exit 0
          git commit -m 'Publish signed Android candidate [skip ci]'
          git push origin HEAD:android

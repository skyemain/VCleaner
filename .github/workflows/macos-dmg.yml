name: macOS DMG

on:
  push:
    branches: [mac]
    paths-ignore:
      - "macos/release/**"
  pull_request:
    branches: [mac]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macos-dmg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dmg:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Verify source layout
        working-directory: macos
        run: scripts/verify-source.sh

      - name: Test native macOS app
        working-directory: macos
        run: xcodebuild -project CleanSlate.xcodeproj -scheme CleanSlate -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO test

      - name: Build unsigned universal app
        working-directory: macos
        run: scripts/build.sh

      - name: Ad-hoc sign so the app can launch locally
        working-directory: macos
        run: |
          codesign --force --deep --sign - build/CleanSlate.app
          codesign --verify --verbose=2 build/CleanSlate.app
          lipo -archs build/CleanSlate.app/Contents/MacOS/CleanSlate

      - name: Package drag-and-drop disk image
        working-directory: macos
        run: scripts/package-dmg.sh 1.0.7

      - uses: actions/upload-artifact@v4
        with:
          name: CleanSlate-1.0.7-mac-universal
          path: macos/release/CleanSlate-1.0.7-mac-universal.dmg
          if-no-files-found: error

      - name: Keep the latest DMG in the mac branch
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/mac'
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git fetch origin mac
          if [ "$(git rev-parse origin/mac)" != "$SOURCE_SHA" ]; then
            echo "A newer source commit exists; its workflow will publish the latest DMG."
            exit 0
          fi
          find macos/release -maxdepth 1 -name '*.dmg' ! -name 'CleanSlate-1.0.7-mac-universal.dmg' -delete
          cp macos/release/CleanSlate-1.0.7-mac-universal.dmg macos/release/CleanSlate-latest-mac-universal.dmg
          (cd macos/release && shasum -a 256 *.dmg > SHA256SUMS.txt)
          cat > macos/release/README.txt <<EOF
          CleanSlate 1.0.7 for macOS 13 and newer (Apple silicon and Intel).

          Share CleanSlate-latest-mac-universal.dmg for the latest successful build.
          CleanSlate-1.0.7-mac-universal.dmg is the same build with its version in the filename.
          Verify downloads against SHA256SUMS.txt.

          Source commit: $SOURCE_SHA
          Build: $RUN_URL

          Open Install CleanSlate in the DMG and choose Install & replace older versions.
          The installed copy opens Cleaning Access for folder approval.
          This build is ad-hoc signed, not notarized;
          macOS may require right-click > Open on first launch.
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A macos/release
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish latest macOS DMG [skip ci]"
          git push origin HEAD:mac

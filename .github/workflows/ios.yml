name: iOS candidate
on:
  push:
    branches: [ios]
  pull_request:
    branches: [ios]
  workflow_dispatch:
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Generate project
        run: python3 scripts/generate-xcodeproj.py
      - name: Test on available iPhone simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if "iPhone" in x["name"]))')
          echo "IOS_SIMULATOR_ID=$DEVICE" >> "$GITHUB_ENV"
          xcodebuild -project Clenzy.xcodeproj -scheme Clenzy -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO test
      - name: Capture native home dashboard
        run: |
          BOOTED=$(xcrun simctl list devices booted -j | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next((x["udid"] for group in d["devices"].values() for x in group if "iPhone" in x["name"]), ""))')
          if [ -n "$BOOTED" ]; then
            IOS_SIMULATOR_ID="$BOOTED"
          else
            xcrun simctl boot "$IOS_SIMULATOR_ID" || true
            xcrun simctl bootstatus "$IOS_SIMULATOR_ID" -b
          fi
          xcrun simctl install "$IOS_SIMULATOR_ID" build/DerivedData/Build/Products/Debug-iphonesimulator/Clenzy.app
          xcrun simctl status_bar "$IOS_SIMULATOR_ID" override --time '9:41'
          xcrun simctl launch "$IOS_SIMULATOR_ID" com.skyemain.Clenzy.ios
          sleep 2
          xcrun simctl io "$IOS_SIMULATOR_ID" screenshot build/Clenzy-home.png
      - uses: actions/upload-artifact@v4
        with:
          name: Clenzy-iOS-dashboard-screenshot
          path: build/Clenzy-home.png
      - name: Build unsigned device archive
        run: xcodebuild -project Clenzy.xcodeproj -scheme Clenzy -destination 'generic/platform=iOS' -archivePath build/Clenzy.xcarchive CODE_SIGNING_ALLOWED=NO archive
      - uses: actions/upload-artifact@v4
        with:
          name: Clenzy-iOS-unsigned-candidate
          path: build/Clenzy.xcarchive
